name: Build and release

# Three ways to get a release:
#
#   1. Bump $script:AppVersion in PackageDeployerStudio.ps1 and push to main.
#      This workflow tags it and publishes the release for you.
#   2. Push a tag yourself:  git tag v1.2.3 && git push origin v1.2.3
#   3. Run it by hand from the Actions tab.
#
# Every push also uploads the zip as a build artifact, so there is always
# something downloadable even without a version bump.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            RAW=$(grep -oP "AppVersion\s*=\s*'\K[^']+" PackageDeployerStudio.ps1)
            VERSION="v${RAW}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Check the PowerShell parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./PackageDeployerStudio.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host "::error file=PackageDeployerStudio.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "PowerShell parses cleanly."

      - name: Check the installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./Install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host "::error file=Install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "Install.ps1 parses cleanly."

      - name: Check the companion parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./pds.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host "::error file=pds.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "pds.ps1 parses cleanly."

      - name: Check the shell installer parses
        run: bash -n install-mac.sh && echo "install-mac.sh parses cleanly."

      - name: Check the XAML parses
        shell: pwsh
        run: |
          $src = Get-Content ./PackageDeployerStudio.ps1 -Raw
          $m   = [regex]::Match($src, "(?s)\`$xaml = @'\r?\n(.*?)\r?\n'@")
          if (-not $m.Success) { throw "Could not find the XAML block." }
          [xml]$doc = $m.Groups[1].Value
          Write-Host "XAML parses cleanly ($($doc.DocumentElement.Name))."

          # Every DynamicResource key must exist in both palettes.
          $light = [regex]::Match($src, "(?s)Light = @\{(.*?)\n    \}").Groups[1].Value
          $dark  = [regex]::Match($src, "(?s)Dark = @\{(.*?)\n    \}").Groups[1].Value
          $lk = [regex]::Matches($light, "(\w+)='#") | ForEach-Object { $_.Groups[1].Value }
          $dk = [regex]::Matches($dark,  "(\w+)='#") | ForEach-Object { $_.Groups[1].Value }
          if (Compare-Object $lk $dk) { throw "Light and Dark palettes do not have the same keys." }
          $used = [regex]::Matches($m.Groups[1].Value, '\{DynamicResource (\w+)\}') |
                  ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $missing = $used | Where-Object { $_ -notin $lk }
          if ($missing) { throw "DynamicResource keys missing from the palette: $($missing -join ', ')" }
          Write-Host "$($lk.Count) palette keys, $($used.Count) referenced, all resolve."

      - name: Build the zip
        id: build
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          STAGE="dist/PackageDeployerStudio"
          mkdir -p "$STAGE"
          cp PackageDeployerStudio.ps1 PackageDeployerStudio.bat \
             Install.ps1 Install.cmd README.md LICENSE "$STAGE/"
          cp pds.ps1 install-mac.sh "$STAGE/" 2>/dev/null || true
          chmod +x "$STAGE/install-mac.sh" 2>/dev/null || true
          cp PackageDeployerStudio.ico  "$STAGE/" 2>/dev/null || true
          cp HOW-TO-DEPLOY-A-PACKAGE.md "$STAGE/" 2>/dev/null || true
          cd dist
          zip -r "PackageDeployerStudio-${VERSION}.zip" PackageDeployerStudio
          cd ..
          echo "zip=dist/PackageDeployerStudio-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PackageDeployerStudio-${{ steps.ver.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Write the release notes
        if: github.event_name != 'pull_request'
        run: |
          cat > notes.md <<'NOTES_END'
          ## Install

          1. Download the zip below.
          2. **Right-click it, Properties, tick Unblock**, then extract.
          3. Double-click **`Install.cmd`** and answer **Yes** when it offers to unblock the files.

          Installs per user to `%LOCALAPPDATA%\Programs\PackageDeployerStudio`
          (no admin rights), adds Start Menu and desktop shortcuts, and registers
          an entry in **Apps and features**.

          The installer also configures Microsoft's Package Deployer tool: it looks
          beside `Install.cmd`, then in your NuGet cache, and otherwise offers to let
          you browse for `PackageDeployer.exe`. That tool is not redistributed here -
          get it from the
          [Package Deployer NuGet package](https://www.nuget.org/packages/Microsoft.CrmSdk.XrmTooling.PackageDeployment.WPF)
          and extract its `tools\` folder. Deploying with the PAC CLI does not need it.

          ### Requirements

          - Windows with PowerShell 5.1 (built in)
          - [PAC CLI](https://learn.microsoft.com/power-platform/developer/cli/introduction)
            and the .NET SDK on `PATH`, for the Solutions and Create Package pages

          ### Uninstall

          Apps and features, or `Install.ps1 -Uninstall`.

          ---

          ## macOS and Linux

          The desktop app is WPF, which is Windows-only, as is Microsoft's
          `pac package deploy`. The zip therefore also contains **`pds`**, a
          terminal companion that runs the same workflow anywhere:

          ```bash
          ./install-mac.sh     # no sudo
          pds                  # interactive menu
          pds doctor           # check pwsh, dotnet and pac
          ```

          Sign-in, environments, solution export/import and package building all
          work natively. Deployment imports each solution in the order the
          package declares; `pds pipeline` generates a GitHub Actions workflow
          that runs the real `pac package deploy` on a Windows runner when a
          package needs full fidelity. See the macOS section of the README.
          NOTES_END
          echo "--- notes.md ---"; cat notes.md

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.value }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set +e   # handle failures explicitly so the cause can be explained

          explain_failure() {
            echo "::error::Could not publish release $VERSION (exit $1)."
            echo "::error::Most likely cause: this repository's Actions token is read-only."
            echo "::error::Fix: Settings > Actions > General > Workflow permissions >"
            echo "::error::     select 'Read and write permissions', Save, then re-run this workflow."
            echo "::error::The zip is still attached to this run under Artifacts, so nothing is lost."
          }

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Version    : $VERSION"
          echo "Asset      : $ZIP"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - replacing its asset."
            OUT=$(gh release upload "$VERSION" "$ZIP" --clobber 2>&1); rc=$?
            echo "$OUT"
            if [ $rc -ne 0 ]; then explain_failure $rc; exit $rc; fi
            echo "Asset updated."
            exit 0
          fi

          # If the tag already exists, create the release from it rather than
          # pointing at this commit - gh refuses to move an existing tag.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists - creating the release from it."
            TARGET=()
          else
            echo "Creating tag $VERSION at $GITHUB_SHA."
            TARGET=(--target "$GITHUB_SHA")
          fi

          OUT=$(gh release create "$VERSION" "$ZIP" \
                  --title "Package Deployer Studio $VERSION" \
                  --notes-file notes.md \
                  "${TARGET[@]}" 2>&1); rc=$?
          echo "$OUT"
          if [ $rc -ne 0 ]; then explain_failure $rc; exit $rc; fi
          echo "Release $VERSION published."
